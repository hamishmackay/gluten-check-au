name = "gluten-check-au-research"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
ENABLE_PUBLIC_API = "true"

[[unsafe.bindings]]
name = "USER_RATE_LIMIT"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Native Workers Builds uploads these reproducible preview assets with the Worker.
# Root GitHub Pages sources are unchanged; preview requests use the same origin API.
[assets]
directory = "./public"
binding = "ASSETS"

[version_metadata]
binding = "CF_VERSION_METADATA"
